[project]
name = "lczero-pytorch"
version = "0.1.0"
description = "PyTorch training pipeline for Leela Chess Zero (BT-style attention nets), with export to the lc0 .pb.gz format."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
    "protobuf>=5,<6",
    "tensorboard>=2.16",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# FP8 training on Blackwell/Hopper/Ada (training.fp8.enabled). Pin a torchao
# build matching your installed torch version.
fp8 = ["torchao>=0.8"]

[project.scripts]
lczero-torch-train = "src.train:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.proto" = ["*.py"]
